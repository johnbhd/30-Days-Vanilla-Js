<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baloorun</title>
    <link rel="icon" href="./img/logo.jpg" type="image/x-icon">
</head>
<body>
<style>
  * {
    font-family: Arial;
    padding: 0;
    margin: 0;
    box-sizing: border-box;
  }
  body {
    background-image: url("./img/bg.jpeg") ;
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    height: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;         
    margin: 0;
  }

  .container {
   
    padding: 4rem 2rem;         
    min-height: 50vh;       
    width: 90%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: rgba(28, 28, 28, 0.6);
    border-radius: 15px;
    color: white;
  }
  .container img {
    widows: 150px;
    height: 150px;
    border-radius: 5px;
    padding-bottom: 20px;
  }

  h1 {
    font-size: 3rem;
    margin-bottom: 1rem;
    color: var(--primary);
  }

  p {
    font-size: 1.2rem;
    margin-bottom: 2rem;
    text-align: center;
    color: var(--accent);
  }
.launch-btn {
    position: relative;
    padding: 1.3rem 3.5rem;
    font-size: 1.6rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #fff0f0;
    background: linear-gradient(145deg, #ff1a4d 0%, #ff3366 50%, #ff1a4d 100%);
    border: 4px solid #ff3366;
    border-radius: 12px;
    box-shadow: 
        0 0 20px rgba(255, 51, 102, 0.7),
        0 0 40px rgba(255, 51, 102, 0.4),
        inset 0 0 15px rgba(255, 51, 102, 0.5);
    cursor: pointer;
    transition: all 0.18s ease;
    overflow: hidden;
}

.launch-btn:hover {
    transform: translateY(-5px) scale(1.07);
    box-shadow: 
        0 0 40px rgba(255, 51, 102, 0.9),
        0 0 70px rgba(255, 51, 102, 0.6),
        inset 0 0 25px rgba(255, 51, 102, 0.7);
    background: linear-gradient(145deg, #ff3366 0%, #ff4d7a 50%, #ff3366 100%);
}

.launch-btn:active {
    transform: translateY(3px) scale(0.97);
    box-shadow: 
        0 0 25px rgba(255, 51, 102, 0.8) inset,
        0 5px 15px rgba(0,0,0,0.4);
}

/* Subtle energy pulse + scan effect */
.launch-btn::before {
    content: "";
    position: absolute;
    top: -100%; left: -50%;
    width: 200%; height: 300%;
    background: linear-gradient(
        to bottom,
        transparent 45%,
        rgba(255, 255, 255, 0.18) 50%,
        transparent 55%
    );
    animation: energy-scan 5s linear infinite;
    pointer-events: none;
}

@keyframes energy-scan {
    0%   { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
}

  @media (max-width: 600px) {
    h1 {
      font-size: 2rem;
    }
    p {
      font-size: 1rem;
    }
    .launch-btn {
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <img src="./img/logo.jpg">
    <p>2D game where you can't rant but you can run, everything feels 2D until bullets fly!</p>
    <button class="launch-btn">Launch Game</button>
  </div>
</body>

<script>
  document.addEventListener("click", (e) => {
    const launchBtn = e.target.closest(".launch-btn");
    
    if (launchBtn) {
      window.location.href = "./pages/chooseMap.html";
    }

  })
</script>
</html>
