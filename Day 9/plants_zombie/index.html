<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plants vs Zombies - Simple Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <!-- Game HUD -->
    <div class="hud">
      <div class="hud-item hud-sun">
        <span class="hud-icon">☀</span>
        <span class="hud-label">Sun</span>
        <span id="sun-count" class="hud-value">200</span>
      </div>
      <div class="hud-item hud-health">
        <span class="hud-icon">♥</span>
        <span class="hud-label">Health</span>
        <span id="health-count" class="hud-value">1</span>
      </div>
      <div class="hud-item hud-level">
        <span class="hud-label">Level</span>
        <span id="level-count" class="hud-value">1</span>
      </div>
    </div>

    <!-- Seed Bank -->
    <div class="seed-bank">
      <div class="plant-slot" data-plant="sunflower">
        <img class="plant-img" src="images/sunflower.png" alt="">
        <span class="plant-name">Sunflower</span>
        <span class="plant-cost">☀ 50</span>
      </div>
      <div class="plant-slot" data-plant="peashooter">
        <img class="plant-img" src="images/peashooter_cut.png" alt="">
        <span class="plant-name">Pea Shooter</span>
        <span class="plant-cost">☀ 100</span>
      </div>
    </div>

    <!-- Game Canvas -->
    <div class="game-area">
      <canvas id="game-canvas" width="600" height="400"></canvas>
    </div>

    <footer class="credits">
      Sprites from OpenGameArt:
      <a href="https://opengameart.org/content/zombie-sprites" target="_blank" rel="noopener">Zombie</a> by Clint Bellanger (CC-BY 3.0),
      <a href="https://opengameart.org/content/cursed-sunflower-with-fire-powers-and-cured-form" target="_blank" rel="noopener">Sunflower</a> by Robyn (CC-BY),
      <a href="https://opengameart.org/content/shadow-man-eating-plant-sprites" target="_blank" rel="noopener">Plant</a> by bevouliin.com (CC-BY 4.0)
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
